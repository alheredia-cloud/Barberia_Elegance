<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Mensajes de Contacto</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body style="background-color: #eee;">
    <img src="../imagenes/logo barberia.png" class="logo-top-right" alt="Logo Barbería">

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h3 style="color: white; text-align: center;">Panel Admin</h3>
            <ul class="sidebar-menu">
                <li><a href="index.html" class="sidebar-item">Dashboard</a></li>
                <li><a href="productos-mgr.html" class="sidebar-item">Productos</a></li>
                <li><a href="usuarios-mgr.html" class="sidebar-item">Usuarios</a></li>
                <li><a href="mensajes-mgr.html" class="sidebar-item">Mensajes</a></li>
                <li><a href="../public/index.html" class="sidebar-item">Ir a la Tienda</a></li>
                <li><a href="../public/login.html" class="sidebar-item" style="color: red;">Cerrar Sesión</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <h2>Bandeja de Entrada</h2>
            <p>Aquí puedes gestionar los mensajes enviados por los clientes desde la web.</p>
            <hr>

            <table class="data-table" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <thead style="background-color: #ddd;">
                    <tr style="text-align: left;">
                        <th>Fecha</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Mensaje</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="mensajes-lista">
                    <!-- Mensajes cargados dinámicamente -->
                </tbody>
            </table>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Barbería Elegance - Trabajo de Evaluación Fullstack</p>
    </footer>

    <script src="../assets/js/storage.service.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        function cargarMensajes() {
            const lista = document.getElementById('mensajes-lista');
            const mensajes = storageService.obtener('mensajes') || [];

            if (mensajes.length === 0) {
                lista.innerHTML = "<tr><td colspan='5' style='text-align: center;'>No hay mensajes disponibles</td></tr>";
                return;
            }

            lista.innerHTML = mensajes.map((m, index) => {
                return `
                    <tr>
                        <td>${m.fecha || 'N/A'}</td>
                        <td>${m.nombre}</td>
                        <td>${m.correo}</td>
                        <td>${m.mensaje}</td>
                        <td><button class="btn btn-outline" style="color: red; border-color: red;" onclick="eliminarMensaje(${index})">Eliminar</button></td>
                    </tr>
                `;
            }).join('');
        }

        function eliminarMensaje(index) {
            if (confirm("¿Estás seguro de que deseas eliminar este mensaje?")) {
                const mensajes = storageService.obtener('mensajes') || [];
                mensajes.splice(index, 1);
                storageService.guardar('mensajes', mensajes);
                cargarMensajes();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarMensajes();
        });
    </script>
</body>
</html>
