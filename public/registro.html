<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barbería Elegance - Registro</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        .form-box {
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <img src="../imagenes/logo barberia.png" class="logo-top-right" alt="Logo Barbería">

    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Servicios</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html" id="btn-login">Login</a>
        <a href="registro.html" id="btn-registro" style="display: none;">Registro</a>
        <a href="carrito.html">Carrito (0)</a>
    </nav>

    <div class="container">
        <div class="form-box">
            <h2>Crear Cuenta</h2>
            <form id="formRegistro">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Correo (@duoc.cl, @gmail.com):</label>
                    <input type="email" id="correo" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña (4-10 caracteres):</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>
            <br>
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Barbería Elegance - Trabajo de Evaluación Fullstack</p>
    </footer>

    <script src="../assets/js/storage.service.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            storageService.inicializarDatos();
            authService.actualizarInterfaz();

            document.getElementById('btn-cerrar-sesion')?.addEventListener('click', (e) => {
                e.preventDefault();
                authService.cerrarSesion();
            });

            const formRegistro = document.getElementById('formRegistro');
            if (formRegistro) {
                formRegistro.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const usuario = {
                        nombre: document.getElementById('nombre').value,
                        email: document.getElementById('correo').value,
                        password: document.getElementById('password').value,
                        rol: 'Client'
                    };

                    const usuarios = storageService.obtener('usuarios') || [];
                    if (usuarios.some(u => u.email === usuario.email)) {
                        alert('El correo ya está registrado');
                        return;
                    }

                    usuarios.push(usuario);
                    storageService.guardar('usuarios', usuarios);
                    alert('Registro exitoso. Ahora puedes iniciar sesión');
                    window.location.href = 'login.html';
                });
            }
        });
    </script>
</body>
</html>
