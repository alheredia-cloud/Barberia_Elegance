<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barbería Elegance - Login</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        .form-box {
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <img src="../imagenes/logo barberia.png" class="logo-top-right" alt="Logo Barbería">

    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Servicios</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html">Login</a>
        <a href="carrito.html">Carrito (<span id="cart-count">0</span>)</a>
    </nav>

    <div class="container">
        <div class="form-box">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <div class="form-group">
                    <label>Correo:</label>
                    <input type="email" id="correo" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
            <br>
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Barbería Elegance - Trabajo de Evaluación Fullstack</p>
    </footer>

    <script src="../assets/js/storage.service.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/validations.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById("formLogin");

            if (!loginForm) {
                console.error("Error: No se encontró el formulario formLogin");
                return;
            }

            loginForm.onsubmit = function(evento) {
                evento.preventDefault();
                console.log("Intentando iniciar sesión...");

                const correo = document.getElementById("correo").value.trim();
                const password = document.getElementById("password").value.trim();

                // 1. Validación de campos vacíos
                if (!correo || !password) {
                    alert("Por favor, rellene todos los campos");
                    return;
                }

                // 2. Validaciones de formato (usando validations.js)
                if (typeof validarCorreo === 'function' && !validarCorreo(correo)) {
                    alert("Error: El correo debe ser @duoc.cl, @profesor.duoc.cl o @gmail.com");
                    return;
                }
                if (typeof validarPassword === 'function' && !validarPassword(password)) {
                    alert("Error: La contraseña debe tener entre 4 y 10 caracteres");
                    return;
                }

                // 3. Proceder al login usando el servicio de autenticación
                if (typeof authService !== 'undefined' && authService.iniciarSesion) {
                    authService.iniciarSesion(correo, password);
                } else {
                    console.error("Error: authService no está definido");
                    alert("Error interno del sistema. Por favor, recargue la página.");
                }
            };
        });
    </script>
</body>
</html>
