<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barbería Elegance - Detalle</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
    <img src="../imagenes/logo barberia.png" class="logo-top-right" alt="Logo Barbería">

    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Servicios</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html">Login</a>
        <a href="carrito.html">Carrito (<span id="cart-count">0</span>)</a>
    </nav>

    <div class="container">
        <div style="display: flex; gap: 30px; align-items: center;">
            <div style="flex: 1; height: 300px; background-color: #ddd; border: 1px solid #ccc; text-align: center; line-height: 300px;">
                <img id="prod-image" src="" alt="Imagen del Servicio" class="detail-img" style="display: none;">
            </div>
            <div style="flex: 1;">
                <h2 id="prod-name">Nombre del Servicio</h2>
                <p><strong id="prod-category">Categoría</strong></p>
                <p id="prod-desc">Descripción detallada del servicio.</p>
                <span id="prod-price" class="price-tag" style="font-size: 1.5rem;">$0.000</span>
                <br>
                <button id="add-to-cart" class="btn btn-primary">Agregar al Carrito</button>
                <a href="productos.html" class="btn btn-outline">Volver</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Barbería Elegance - Trabajo de Evaluación Fullstack</p>
    </footer>

    <script src="../assets/js/storage.service.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));

            const productos = storageService.obtener('productos') || [];
            const producto = productos.find(p => p.id === productId);

            if (producto) {
                document.getElementById('prod-name').innerText = producto.nombre;
                document.getElementById('prod-category').innerText = producto.categoria;
                document.getElementById('prod-price').innerText = `$${producto.precio.toLocaleString()}`;

                // Asignación de imagen basada en el nombre (como en productos.html)
                const imgPath = producto.nombre === 'Corte Clásico' ? 'corte clasico.jpe' :
                                producto.nombre === 'Barba Completa' ? 'Barba completa.jpe' :
                                producto.nombre === 'Combo Elegance' ? 'afeitado imperial.jpg' :
                                producto.nombre === 'Cera Modeladora' ? 'pomada modeladora.jpe' :
                                'logo barberia.png';

                const imgEl = document.getElementById('prod-image');
                imgEl.src = `../imagenes/${imgPath}`;
                imgEl.style.display = 'block';

                // Botón agregar al carrito
                const btn = document.getElementById('add-to-cart');
                if (producto.stock <= 0) {
                    btn.innerText = 'Agotado';
                    btn.disabled = true;
                    btn.className = 'btn-disabled';
                } else {
                    btn.onclick = () => agregarAlCarrito(producto.id);
                }
            } else {
                document.getElementById('prod-name').innerText = 'Producto no encontrado';
                document.getElementById('add-to-cart').disabled = true;
            }

            // Actualizar contador del carrito
            actualizarContadorCarrito();
        });
    </script>
</body>
</html>
